# jzo2o（云岚到家）Kubernetes 部署 YAML 合集
# 从项目部署笔记提取，按部署顺序编号，可直接 kubectl apply -f 应用

# ============================================================
# 来源：三.NFS,MYSQL,Nacos组件的部署.md
# ============================================================

# ---------- 1. Secret/mysql-secret ----------
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: jzo2o
type: Opaque
data:
  MYSQL_ROOT_PASSWORD: QWExMjM0NTYu
  MYSQL_USER: bmFjb3M=
  MYSQL_PASSWORD: QWExMjM0NTYu
---

# ---------- 2. ConfigMap/mysql-config ----------
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-config
  namespace: jzo2o
data:
  my.cnf: |
    [client]
    default-character-set = utf8mb4

    [mysqld]
    log-bin=mysql-bin
    binlog-format=ROW
    server_id=1
    character_set_server=utf8mb4
    collation_server=utf8mb4_bin
---

# ---------- 3. PersistentVolume/mysql-pv-single ----------
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mysql-pv-single
  labels:
    app: mysql
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: worker02.itcast.cn
    path: /data/nfs/mysql-single
---

# ---------- 4. PersistentVolumeClaim/mysql-pvc-single ----------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc-single
  namespace: jzo2o
spec:
  accessModes:
    - ReadWriteOnce
  selector:
    matchLabels:
      app: mysql
  resources:
    requests:
      storage: 10Gi
---

# ---------- 5. StatefulSet/mysql ----------
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: jzo2o
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/mysql:8.0.26
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 1Gi
          ports:
            - containerPort: 3306
              name: mysql
          env:
            - name: TZ
              value: Asia/Shanghai
            - name: MYSQL_DATABASE
              value: db_nacos_config
          envFrom:
            - secretRef:
                name: mysql-secret
          volumeMounts:
            - name: mysql-config
              mountPath: /etc/mysql/conf.d/my.cnf
              subPath: my.cnf
            - name: mysql-data
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-config
          configMap:
            name: mysql-config
        - name: mysql-data
          persistentVolumeClaim:
            claimName: mysql-pvc-single
---

# ---------- 6. Service/mysql ----------
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: jzo2o
spec:
  selector:
    app: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
---

# ---------- 7. ConfigMap/nacos-config ----------
apiVersion: v1
kind: ConfigMap
metadata:
  name: nacos-config
  namespace: jzo2o
data:
  application.properties: |
    nacos.server.main.port=8848
    nacos.server.contextPath=/nacos
    nacos.core.member.lookup.type=file
    spring.sql.init.platform=mysql
    db.num=1
    db.url.0=jdbc:mysql://mysql:3306/db_nacos_config?characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useUnicode=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    db.user=root
    db.password=Aa123456.
    nacos.core.api.compatibility.client.enabled=true
    nacos.core.auth.system.type=nacos
    nacos.core.auth.enabled=false
    nacos.core.auth.admin.enabled=true
    nacos.core.auth.console.enabled=true
    nacos.core.auth.plugin.nacos.token.secret.key=U2VjcmV0S2V5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5
    nacos.core.auth.server.identity.key=serverIdentity
    nacos.core.auth.server.identity.value=security
    nacos.security.ignore.urls=/,/error,/**/*.css,/**/*.js,/**/*.html,/**/*.map,/**/*.svg,/**/*.png,/**/*.ico,/console-ui/public/**,/next/**,/legacy/**,/v1/auth/**,/v3/auth/**,/v1/console/health/**,/actuator/**,/v1/console/server/**
    management.metrics.export.elastic.enabled=false
    management.metrics.export.influx.enabled=false
