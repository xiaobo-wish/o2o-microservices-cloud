# 组件：jzo2o-gateway
# 从 jz.yaml 拆分，可直接 kubectl apply -f 应用

# ---------- 33. Service/jzo2o-gateway ----------
---
apiVersion: v1
kind: Service
metadata:
  name: jzo2o-gateway
  namespace: jzo2o
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 11500
      targetPort: 11500
---

# ---------- 40. Deployment/jzo2o-gateway ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jzo2o-gateway
  namespace: jzo2o
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jzo2o-gateway
  template:
    metadata:
      labels:
        app: jzo2o-gateway
    spec:
      containers:
        - name: jzo2o-gateway
          image: jzo2o/jzo2o-gateway:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 11500
          env:
            - name: NACOS_USERNAME
              value: nacos
            - name: NACOS_PASSWORD
              value: nacos
            - name: NACOS_ADDR
              value: nacos:8848
            - name: NACOS_NAMESPACE
              value: "75a593f5-33e6-4c65-b2a0-18c403d20f63"
            - name: JAVA_OPTS
              value: "-Dspring.profiles.active=prod -Xms128m -Xmx256m"
---

# ---------- 41. Service/jzo2o-gateway ----------
apiVersion: v1
kind: Service
metadata:
  name: jzo2o-gateway
  namespace: jzo2o
spec:
  type: NodePort
  selector:
    app: jzo2o-gateway
  ports:
    - name: http
      port: 11500
      targetPort: 11500
      nodePort: 31500
---
