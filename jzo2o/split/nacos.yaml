# 组件：nacos
# 从 jz.yaml 拆分，可直接 kubectl apply -f 应用

# ---------- 7. ConfigMap/nacos-config ----------
apiVersion: v1
kind: ConfigMap
metadata:
  name: nacos-config
  namespace: jzo2o
data:
  application.properties: |
    nacos.server.main.port=8848
    nacos.server.contextPath=/nacos
    nacos.core.member.lookup.type=file
    spring.sql.init.platform=mysql
    db.num=1
    db.url.0=jdbc:mysql://mysql:3306/db_nacos_config?characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useUnicode=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    db.user=root
    db.password=Aa123456.
    nacos.core.api.compatibility.client.enabled=true
    nacos.core.auth.system.type=nacos
    nacos.core.auth.enabled=false
    nacos.core.auth.admin.enabled=true
    nacos.core.auth.console.enabled=true
    nacos.core.auth.plugin.nacos.token.secret.key=U2VjcmV0S2V5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5
    nacos.core.auth.server.identity.key=serverIdentity
    nacos.core.auth.server.identity.value=security
    nacos.security.ignore.urls=/,/error,/**/*.css,/**/*.js,/**/*.html,/**/*.map,/**/*.svg,/**/*.png,/**/*.ico,/console-ui/public/**,/next/**,/legacy/**,/v1/auth/**,/v3/auth/**,/v1/console/health/**,/actuator/**,/v1/console/server/**
    management.metrics.export.elastic.enabled=false
    management.metrics.export.influx.enabled=false
  cluster.conf: |
    127.0.0.1:8848
---

# ---------- 8. PersistentVolume/nacos-pv-single ----------
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nacos-pv-single
  labels:
    app: nacos
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: worker02.itcast.cn
    path: /data/nfs/nacos-single
---

# ---------- 9. PersistentVolumeClaim/nacos-pvc-single ----------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nacos-pvc-single
  namespace: jzo2o
spec:
  accessModes:
    - ReadWriteOnce
  selector:
    matchLabels:
      app: nacos
  resources:
    requests:
      storage: 5Gi
---

# ---------- 10. Deployment/nacos ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nacos
  namespace: jzo2o
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nacos
  template:
    metadata:
      labels:
        app: nacos
    spec:
      containers:
        - name: nacos
          image: docker.io/nacos/nacos-server:v3.0.3
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 768Mi
          ports:
            - containerPort: 8848
              name: http
            - containerPort: 8080
              name: console
          env:
            - name: MODE
              value: standalone
            - name: JVM_XMS
              value: 256m
            - name: JVM_XMX
              value: 512m
            - name: PREFER_HOST_MODE
              value: hostname
            - name: NACOS_AUTH_TOKEN
              value: U2VjcmV0S2V5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5
            - name: NACOS_AUTH_IDENTITY_KEY
              value: serverIdentity
            - name: NACOS_AUTH_IDENTITY_VALUE
              value: security
          volumeMounts:
            - name: nacos-config
              mountPath: /home/nacos/conf/application.properties
              subPath: application.properties
            - name: data
              mountPath: /home/nacos/data
              subPath: data
            - name: data
              mountPath: /home/nacos/logs
              subPath: logs
      volumes:
        - name: nacos-config
          configMap:
            name: nacos-config
        - name: data
          persistentVolumeClaim:
            claimName: nacos-pvc-single
---

# ---------- 11. Service/nacos ----------
apiVersion: v1
kind: Service
metadata:
  name: nacos
  namespace: jzo2o
spec:
  type: NodePort
  selector:
    app: nacos
  ports:
    - name: http
      port: 8848
      targetPort: 8848
      nodePort: 30848
    - name: console
      port: 8080
      targetPort: 8080
      nodePort: 30081
  curl -s -o /dev/null -w "%{http_code}\n" http://localhost:8848/nacos/
---
