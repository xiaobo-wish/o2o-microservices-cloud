# 组件：project-xzb-pc-admin-vue3-java
# 从 jz.yaml 拆分，可直接 kubectl apply -f 应用

# ---------- 30. ConfigMap/frontend-nginx-config ----------
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx-config
  namespace: jzo2o
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        client_max_body_size 30m;

        root /usr/share/nginx/html;
        index index.html index.htm;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass http://jzo2o-gateway:11500/; 
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
---

# ---------- 31. Deployment/project-xzb-pc-admin-vue3-java ----------
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: project-xzb-pc-admin-vue3-java
  namespace: jzo2o
spec:
  replicas: 1
  selector:
    matchLabels:
      app: project-xzb-pc-admin-vue3-java
  template:
    metadata:
      labels:
        app: project-xzb-pc-admin-vue3-java
    spec:
      nodeSelector:
        kubernetes.io/hostname: worker01.itcast.cn
      containers:
        - name: nginx
          image: jzo2o/project-xzb-pc-admin-vue3-java:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: frontend-nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: frontend-nginx-config
          configMap:
            name: frontend-nginx-config
---

# ---------- 32. Service/project-xzb-pc-admin-vue3-java ----------
---
apiVersion: v1
kind: Service
metadata:
  name: project-xzb-pc-admin-vue3-java
  namespace: jzo2o
spec:
  type: NodePort
  selector:
    app: project-xzb-pc-admin-vue3-java
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30888
---
