# 组件：sentinel-dashboard
# 从 jz.yaml 拆分，可直接 kubectl apply -f 应用

# ---------- 45. Deployment/sentinel-dashboard ----------
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-dashboard
  namespace: jzo2o
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sentinel-dashboard
  template:
    metadata:
      labels:
        app: sentinel-dashboard
    spec:
      containers:
        - name: sentinel-dashboard
          image: bladex/sentinel-dashboard:1.8.5
          ports:
            - containerPort: 8858
          env:
            - name: TZ
              value: Asia/Shanghai
            - name: JAVA_OPTS
              value: >-
                -Dserver.port=8858
                -Dproject.name=sentinel-dashboard
                -Dsentinel.dashboard.auth.username=sentinel
                -Dsentinel.dashboard.auth.password=sentinel
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: 8858
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 3
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /
              port: 8858
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 3
            failureThreshold: 6
---

# ---------- 46. Service/sentinel-dashboard ----------
apiVersion: v1
kind: Service
metadata:
  name: sentinel-dashboard
  namespace: jzo2o
spec:
  type: NodePort
  selector:
    app: sentinel-dashboard
  ports:
    - name: http
      port: 8858
      targetPort: 8858
      nodePort: 30087
---
