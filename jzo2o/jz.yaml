# ---------- 8. PersistentVolume/nacos-pv-single ----------
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nacos-pv-single
  labels:
    app: nacos
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: worker02.itcast.cn
    path: /data/nfs/nacos-single
---

# ---------- 9. PersistentVolumeClaim/nacos-pvc-single ----------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nacos-pvc-single
  namespace: jzo2o
spec:
  accessModes:
    - ReadWriteOnce
  selector:
    matchLabels:
      app: nacos
  resources:
    requests:
      storage: 5Gi
---

# ---------- 10. Deployment/nacos ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nacos
  namespace: jzo2o
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nacos
  template:
    metadata:
      labels:
        app: nacos
    spec:
      containers:
        - name: nacos
          image: docker.io/nacos/nacos-server:v3.0.3
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 768Mi
          ports:
            - containerPort: 8848
              name: http
            - containerPort: 8080
              name: console
          env:
            - name: MODE
              value: standalone
            - name: JVM_XMS
              value: 256m
            - name: JVM_XMX
              value: 512m
            - name: PREFER_HOST_MODE
              value: hostname
            - name: NACOS_AUTH_TOKEN
              value: U2VjcmV0S2V5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5
            - name: NACOS_AUTH_IDENTITY_KEY
              value: serverIdentity
            - name: NACOS_AUTH_IDENTITY_VALUE
              value: security
          volumeMounts:
            - name: nacos-config
              mountPath: /home/nacos/conf/application.properties
              subPath: application.properties
            - name: data
              mountPath: /home/nacos/data
              subPath: data
            - name: data
              mountPath: /home/nacos/logs
              subPath: logs
      volumes:
        - name: nacos-config
          configMap:
            name: nacos-config
        - name: data
          persistentVolumeClaim:
            claimName: nacos-pvc-single
---

# ---------- 11. Service/nacos ----------
apiVersion: v1
kind: Service
metadata:
  name: nacos
  namespace: jzo2o
spec:
  type: NodePort
  selector:
    app: nacos
  ports:
    - name: http
      port: 8848
      targetPort: 8848
      nodePort: 30848
    - name: console
      port: 8080
      targetPort: 8080
      nodePort: 30081
  curl -s -o /dev/null -w "%{http_code}\n" http://localhost:8848/nacos/
---

