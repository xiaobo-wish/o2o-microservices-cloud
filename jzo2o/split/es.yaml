# 组件：es
# 从 jz.yaml 拆分，可直接 kubectl apply -f 应用

# ---------- 17. ConfigMap/es-config ----------
apiVersion: v1
kind: ConfigMap
metadata:
  name: es-config
  namespace: jzo2o
data:
  elasticsearch.yml: |
    cluster.name: es-jzo2o
    node.name: es-0
    network.host: 0.0.0.0
    http.port: 9200
    discovery.type: single-node
    xpack.security.enabled: false
    xpack.security.enrollment.enabled: false
    xpack.security.http.ssl.enabled: false
    xpack.security.transport.ssl.enabled: false
    http.cors.enabled: true
    http.cors.allow-origin: "*"
    http.cors.allow-headers: Authorization,X-Requested-With,Content-Type,Content-Length
---

# ---------- 18. PersistentVolume/es-pv-single ----------
apiVersion: v1
kind: PersistentVolume
metadata:
  name: es-pv-single
  labels:
    app: es
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  nfs:
    server: worker02.itcast.cn
    path: /data/nfs/es-single
---

# ---------- 19. PersistentVolumeClaim/es-pvc-single ----------
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: es-pvc-single
  namespace: jzo2o
spec:
  accessModes:
    - ReadWriteOnce
  selector:
    matchLabels:
      app: es
  resources:
    requests:
      storage: 5Gi
---

# ---------- 20. Deployment/es ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: es
  namespace: jzo2o
spec:
  replicas: 1
  selector:
    matchLabels:
      app: es
  template:
    metadata:
      labels:
        app: es
    spec:
      initContainers:
        - name: set-vm-max-map-count
          image: docker.io/library/busybox:1.36
          command: ["sysctl", "-w", "vm.max_map_count=262144"]
          securityContext:
            privileged: true

      containers:
        - name: es
          image: docker.io/library/elasticsearch:8.15.3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9200
              name: http
            - containerPort: 9300
              name: transport
          env:
            - name: ES_JAVA_OPTS
              value: "-Xms512m -Xmx512m"
            - name: discovery.type
              value: "single-node"
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: es-config
              mountPath: /usr/share/elasticsearch/config/elasticsearch.yml
              subPath: elasticsearch.yml
            - name: es-data
              mountPath: /usr/share/elasticsearch/data
      volumes:
        - name: es-config
          configMap:
            name: es-config
        - name: es-data
          persistentVolumeClaim:
            claimName: es-pvc-single
---

# ---------- 21. Service/es ----------
apiVersion: v1
kind: Service
metadata:
  name: es
  namespace: jzo2o
spec:
  type: NodePort
  selector:
    app: es
  ports:
    - name: http
      port: 9200
      targetPort: 9200
      nodePort: 30200
    - name: transport
      port: 9300
      targetPort: 9300
      nodePort: 30300
---
