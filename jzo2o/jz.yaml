# ---------- 25. Service/canal ----------
apiVersion: v1
kind: Service
metadata:
  name: canal
  namespace: jzo2o
spec:
  type: NodePort
  selector:
    app: canal
  ports:
    - name: tcp
      port: 11111
      targetPort: 11111
      nodePort: 31111
    - name: metrics
      port: 11112
      targetPort: 11112
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: canal
  namespace: jzo2o
spec:
  replicas: 1
  selector:
    matchLabels:
      app: canal
  template:
    metadata:
      labels:
        app: canal
    spec:
      initContainers:
        - name: init-canal-config
          image: docker.io/canal/canal-server:v1.1.5
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -e
              cp -a /home/admin/canal-server/conf/. /work/conf/
              rm -rf /work/conf/example
              mkdir -p /work/conf/xzb-canal
              cp /config/canal.properties /work/conf/canal.properties
              cp /config/instance.properties /work/conf/xzb-canal/instance.properties
              chmod -R u+rwX,go+rX /work/conf
          volumeMounts:
            - name: canal-config
              mountPath: /config
            - name: canal-conf-work
              mountPath: /work/conf
      containers:
        - name: canal
          image: docker.io/canal/canal-server:v1.1.5
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 11111
              name: tcp
            - containerPort: 11112
              name: metrics
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: canal-conf-work
              mountPath: /home/admin/canal-server/conf
      volumes:
        - name: canal-config
          configMap:
            name: canal-config
            items:
              - key: canal.properties
                path: canal.properties
              - key: instance.properties
                path: instance.properties
        - name: canal-conf-work
          persistentVolumeClaim:
            claimName: canal-pvc-single
---

