# 组件：jzo2o-orders-seize
# 从 jz.yaml 拆分，可直接 kubectl apply -f 应用

# ---------- 49. Deployment/jzo2o-orders-seize ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jzo2o-orders-seize
  namespace: jzo2o
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jzo2o-orders-seize
  template:
    metadata:
      labels:
        app: jzo2o-orders-seize
    spec:
      containers:
        - name: jzo2o-orders-seize
          image: jzo2o/jzo2o-orders-seize:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 11506
          env:
            - name: NACOS_USERNAME
              value: nacos
            - name: NACOS_PASSWORD
              value: nacos
            - name: NACOS_ADDR
              value: nacos:8848
            - name: NACOS_NAMESPACE
              value: "75a593f5-33e6-4c65-b2a0-18c403d20f63"
            - name: JAVA_OPTS
              value: "-Dspring.profiles.active=prod -Xms128m -Xmx256m"
---

# ---------- 50. Service/jzo2o-orders-seize ----------
apiVersion: v1
kind: Service
metadata:
  name: jzo2o-orders-seize
  namespace: jzo2o
spec:
  type: ClusterIP
  selector:
    app: jzo2o-orders-seize
  ports:
    - name: http
      port: 11506
      targetPort: 11506
---
