# ---------- 30. ConfigMap/frontend-nginx-config ----------
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx-config
  namespace: jzo2o
data:
  default.conf: |
    server {
        listen 80;
        server_name _;
        client_max_body_size 30m;

        root /usr/share/nginx/html;
        index index.html index.htm;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass http://jzo2o-gateway:11500/; 
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
---

# ---------- 31. Deployment/project-xzb-pc-admin-vue3-java ----------
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: project-xzb-pc-admin-vue3-java
  namespace: jzo2o
spec:
  replicas: 1
